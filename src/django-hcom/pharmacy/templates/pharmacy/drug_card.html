<!-- Model cards location -->
<div class="row mt-3" id="cardView">
  {% for object in objects %}
  <div class="col-sm-12 col-md-6">
    <div class="card border-primary mb-3 shadow">
      <div class="card-body">
        <h5 class="card-title">
          <a href="#" 
             class="text-decoration-none"
             onclick="ReadDataEntry({{ object.id }})"
             >
             {{ object.drug_name }}
          </a>
        </h5>
  			<p class="card-text">
  			<span class="text-muted mb-3">{{ object.company }}</span>
  			</p>
  			<div class="row">
  		    <dt class="col-md-3 col-sm-6">Drug Name</dt>
  		    <dd class="col-md-9 col-sm-6">{{ object.drug_name }}</dd>
  		    <dt class="col-md-3 col-sm-6">Drug Price</dt>
  		    <dd class="col-md-9 col-sm-6">{{ object.drug_price }}</dd>
  			</div>
  			<hr>
  			<div class="btn-group shadow" role="group">
          <a class="btn btn-sm btn-success" 
             type="button" 
             title="Edit Drug {{ object.drug_name }}" 
             onclick="UpdateDataEntry({{ object.id }})"
             href="#">
            <i class="fas fa-edit"></i>
          </a>
  		    <a class="btn btn-sm btn-danger" 
             type="button" 
             title="Delete Drug {{ object.drug_name }}" 
             onclick="DeleteDataEntry({{ object.id }})"
             href="#">
            <i class="fas fa-trash"></i>
          </a>
  			</div>
      </div> 
    </div>
  </div>
  {% empty %}
  <p class="alert alert-info">There are no drugs, please add one.</p>
  {% endfor %}
</div>
